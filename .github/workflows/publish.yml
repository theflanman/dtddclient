name: publish

on:
  push:
    tags: ["v*.*.*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-publish
    permissions:
      contents: write  # softprops/action-gh-release creates a GitHub release
      id-token: write  # required for the OIDC handshake with nuget.org
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          dotnet pack src/DoesTheDogDie --configuration Release -p:Version=$VERSION -o ./artifacts

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Attach packages to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Both globs are needed: *.nupkg does not match *.snupkg, so without
          # the second line the symbols package is pushed to nuget.org but never
          # attached to the GitHub release.
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
