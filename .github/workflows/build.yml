name: build

on:
  push:
    branches: [main, phases-*]
  pull_request:
    branches: [main, phases-*]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release
        env:
          # DTDD_API_KEY is intentionally not set: IntegrationFact tests self-skip
          # without it, so CI never spends the free-tier monthly request budget.
          DOTNET_NOLOGO: "1"
